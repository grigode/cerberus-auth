services:
  postgres:
    image: postgres:17-alpine
    container_name: cerberus-postgres
    restart: unless-stopped
    ports:
      - "${MAIN_DATABASE_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${MAIN_DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${MAIN_DATABASE_PASSWORD:-password}
      POSTGRES_DB: ${MAIN_DATABASE_NAME:-cerberus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MAIN_DATABASE_USERNAME:-postgres} -d ${MAIN_DATABASE_NAME:-cerberus}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cerberus-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cerberus-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
